  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1050" cy="38" r="180" fill="#809cff" opacity="0.08"/>
  <circle cx="1130" cy="300" r="210" fill="#e0a2ff" opacity="0.08"/>
  <path d="M0 292 C210 250 360 350 580 300 S940 250 1200 300" fill="none" stroke="#a9c5ff" stroke-opacity="0.12" stroke-width="2"/>
  <g filter="url(#shadow)">
