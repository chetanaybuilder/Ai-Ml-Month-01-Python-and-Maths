<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI and ML Month 1: Python and Maths - Day 1</title>
  <desc id="description">A dimensional blue and violet banner for a Python number guessing game project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b3d"/>
      <stop offset="0.55" stop-color="#253b78"/>
      <stop offset="1" stop-color="#542e86"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#c5d9ff"/>
